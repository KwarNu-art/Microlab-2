name: NovaShield CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-novashield:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ⚙️ Setup Theos Suite (Instant Ubuntu Runner)
        uses: Randomblock1/theos-action@v1

      - name: 🔨 Compile NovaShield Rootless arm64 Tweak (.deb)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ./NovaShield-Rootless-arm64.deb || true
          ls -la *.deb

      - name: 🚀 Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaShield-iOS-arm64-Build-Artifacts
          path: |
            *.deb
            depiction.json

      - name: 🏷️ Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-rescue
          name: 'NovaShield Release v1.0.0 (Rootless arm64)'
          body: |
            ## ⚡️ NovaShield: Performance & Thermal Rescue Engine for iPhone 7 Plus
            
            Compiled automatically for **@${{ github.repository_owner }}** on repository **Microlab-2**:
            - **NovaShield-Rootless-arm64.deb**: Native 64-bit rootless package for **Dopamine & Palera1n (iOS 15.0 - 16.x)**.
            
            ### ✨ Core Highlights:
            - 🌙 **Zero Standby Battery Drain**: Automatically suspends telemetry when screen is locked.
            - 💎 **Apple-Style Glassmorphism HUD**: Smooth spring-animated `NovaHUD` warning overlay.
            - ⚡️ **One-Tap 'Boost & Cool' Rescue**: Purges memory and deprioritizes runaway background daemons.
            - 🎮 **MLBB & Telegram Auto-Boost**: Priority execution queues for smooth gaming.
            - ⚙️ **Settings Integration**: Preference pane with customization sliders and live test button.
          files: |
            *.deb
            depiction.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
